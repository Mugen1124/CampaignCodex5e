name: checks

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install (the same packages setup installs)
        run: python -m pip install -r requirements.txt

      - name: JavaScript syntax
        shell: bash
        run: for f in docs/javascripts/*.js docs/players/*.js publish/players/*.js publish/players/*.mjs; do node --check "$f"; done

      - name: Python syntax
        run: python -m compileall -q codex hooks tools tests

      - name: Commands load
        run: python -m codex --help

      - name: Smoke tests (demo builds, leak check, setup wizard)
        run: python tests/smoke.py
