# Your players' site: its name and its menus - what the players may see. How DM material is kept out
# (DM boxes, dm_only pages, secrets, the leak check) is the engine's job: codex/site-players.yml.
# Pages that aren't in the menu below aren't in the players' menu - but they're still built unless
# they're dm_only: true or in the engine's exclude list, so mark DM-only pages dm_only: true.
INHERIT: codex/site-players.yml

site_name: The Lantern Coast — Players
site_description: The campaign, for its players

nav:
  - Sessions: []          # filled in by hooks/sessions.py: each session, newest first (the home page is the latest)
  - Initiative: players/tracker.md
  - My Notes: players/notes.md
  - Party:
      - party/index.md
      - About this site: players/about.md
      - People: reference/npcs.md
      - Items: reference/items.md
  - World:
      - world/index.md
      - Factions: world/factions.md
      - Maps: maps/index.md
      - Places: cities/index.md
      - Greywater:
          - cities/greywater/index.md
          - Locations: cities/greywater/locations.md
          - People: cities/greywater/people.md
          - Factions: cities/greywater/factions.md
  - Rules:
      - rules/index.md
      - House Rules: world/house-rules.md
      - DM Screen: rules/dm-screen.md
      - Conditions: rules/conditions.md
      - Combat: rules/combat.md
      - Abilities & checks: rules/abilities.md
      - Adventuring: rules/adventuring.md
      - Spellcasting: rules/spellcasting.md
      - Spells: rules/spells.md
      - Magic Item Rules: rules/magic-item-rules.md
      - Magic Items: rules/magic-items.md
      - Equipment: rules/equipment.md
      - Characters: rules/characters.md
      - Monsters, NPCs & planes: rules/more.md
