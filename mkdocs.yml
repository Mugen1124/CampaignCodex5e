# Your DM site: its name and its menus. Everything else - theme, Markdown, hooks - comes from the
# engine (codex/site.yml, replaced by `codex update`). A setting added here wins over the engine's.
INHERIT: codex/site.yml

site_name: The Lantern Coast — DM
site_description: Campaign prep and table reference

# The engine's hooks (codex/site.yml), plus the NPC cards (hooks/npc_cards.py), which must come
# before entities.py. If a `codex update` adds a hook to codex/site.yml, add it here too.
hooks:
  - hooks/sessions.py
  - hooks/session_dates.py   # Session N: Title entries with their date and time
  - hooks/campaign.py
  - hooks/maps.py
  - hooks/rules.py
  - hooks/npc_cards.py
  - hooks/entities.py
  - hooks/page_editor.py     # the pencil that edits a page's Markdown (DM site only)

# The engine's theme features minus navigation.sections and navigation.indexes: regions in the World
# menu are dropdowns rather than always-open headings, and each section's main page is a row in its
# menu (styled in docs/stylesheets/campaign.css).
# This replaces the engine's list: after a `codex update`, compare it with codex/site.yml.
theme:
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - toc.follow
    - content.tabs.link

# Tab and page order. Top-level entries become the tabs across the header.
nav:
  - Sessions: []          # filled in by hooks/sessions.py: This Session, then each session, newest first
  - Party: party/index.md
  - World:
      - world/index.md
      - Factions: world/factions.md
      - Maps: maps/index.md
      - Places: cities/index.md
      - Greywater:
          - cities/greywater/index.md
          - Locations: cities/greywater/locations.md
          - People: cities/greywater/people.md
          - Factions: cities/greywater/factions.md
          - Events & Hooks: cities/greywater/events.md
  - Arcs:
      - arcs/index.md
      - The Drowned Bell: arcs/the-drowned-bell.md
  - Encounters: encounters/index.md
  - Rules:
      - rules/index.md
      - House Rules: world/house-rules.md
      - DM Screen: rules/dm-screen.md
      - Conditions: rules/conditions.md
      - Combat: rules/combat.md
      - Abilities & checks: rules/abilities.md
      - Adventuring: rules/adventuring.md
      - Spellcasting: rules/spellcasting.md
      - Spells: rules/spells.md
      - Magic Item Rules: rules/magic-item-rules.md
      - Magic Items: rules/magic-items.md
      - Equipment: rules/equipment.md
      - Characters: rules/characters.md
      - Monsters, NPCs & planes: rules/more.md
  - Reference:
      - Bestiary: reference/bestiary.md
      - Items: reference/items.md
      - NPC Index: reference/npcs.md
      - Style Guide: reference/style-guide.md
  - Guide:
      - guide/index.md
      - Your campaign: guide/your-campaign.md
      - Writing pages: guide/writing-pages.md
      - Data files: guide/data-files.md
      - At the table: guide/at-the-table.md
      - The players' site: guide/players-site.md
      - Going online: guide/going-online.md
      - Recording sessions: guide/recording.md
      - Working with Claude: guide/ai-assistant.md
      - Troubleshooting: guide/troubleshooting.md
  - Record & Transcribe: recording.md   # kept last; campaign.css pushes it to the far right
