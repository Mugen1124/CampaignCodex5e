# The party. Encounters use level and size for their difficulty math.
# Each member can carry card fields (AC, HP, abilities, features...) for the Party page and the
# initiative tracker - see templates/character.yml, or use Edit on the Party page while CampaignCodex5e runs.
# email: (optional) is the address a player signs in to the players' site with - only needed if
# you put the players' site online. Emails never appear on any page.
level: 3
size: 3
members:
  - player: Player One
    email: player@example.com   # the demo player: sign in with this to be Tam
    character: Tamsin "Tam" Underbough
    race: Lightfoot Halfling
    class: Rogue (Thief)
    background: Acolyte
    level: 3
    ac: 14
    ac_note: leather
    hp: 24
    hp_formula: 3d8
    speed: 25 ft.
    initiative: 3
    passive_perception: 13
    abilities: {str: 8, dex: 17, con: 14, int: 12, wis: 12, cha: 12}
    saves: Dex +5, Int +3
    skills: Acrobatics +5, Insight +3, Investigation +3, Perception +3, Religion +3, Stealth +7
    languages: Thieves’ Cant, Common, Halfling, Elvish, Dwarvish
    proficiencies:
      armor: Light Armor
      weapons: Simple Weapons, Unarmed Strike, Hand Crossbow, Longsword, Rapier, Shortsword
      tools: Tool Proficiency (Thieves’ tools)
    features:
      - name: Sneak Attack
        text: Once per turn, you can deal an extra 2d6 damage to one creature you hit with an attack if you have advantage on the attack roll. The attack must use a finesse or a ranged weapon. You don’t need advantage on the attack roll if another enemy of the target is within 5 feet of it, that enemy isn’t incapacitated, and you don’t have disadvantage on the attack roll.
      - name: Tool Expertise (Thieves’ Tools)
        text: Your proficiency bonus is doubled for any Thieves’ Tools check you make.
      - name: Second-Story Work
        text: Climbing no longer costs you extra movement. When you make a running jump, the distance you cover increases by 3 feet.
      - name: Lucky
        text: When you roll a 1 on an attack roll, ability check, or saving throw, you can reroll the die and must use the new roll.
      - name: Brave
        text: You have advantage on saving throws against being frightened.
      - name: Halfling Nimbleness
        text: You can move through the space of any creature that is of a size larger than yours.
      - name: Naturally Stealthy
        text: You can attempt to hide even when you are obscured only by a creature that is at least one size larger than you.
      - name: Shelter of the Faithful
        text: As an acolyte, you command the respect of those who share your faith, and you can perform the religious ceremonies of your deity. You and your adventuring companions can expect to receive free healing and care at a temple, shrine, or other established presence of your faith, though you must provide any material components needed for spells. Those who share your religion will support you (but only you) at a modest lifestyle. You might also have ties to a specific temple dedicated to your chosen deity or pantheon, and you have a residence there. This could be the temple where you used to serve, if you remain on good terms with it, or a temple where you have found a new home. While near your temple, you can call upon the priests for assistance, provided the assistance you ask for is not hazardous and you remain in good standing with your temple.
    actions:
      - name: Shortsword
        text: '*Attack:* +5 to hit, range 5 ft. *Hit:* 1d6+3 piercing.'
      - name: Shortbow
        text: '*Attack:* +5 to hit, range 80/320. *Hit:* 1d6+3 piercing.'
      - name: Dagger
        text: '*Attack:* +5 to hit, range 20/60. *Hit:* 1d4+3 piercing.'
    bonus_actions:
      - name: Cunning Action
        text: You can take the Dash, Disengage, or Hide action.
      - name: Fast Hands
        text: You can make a Sleight of Hand check, use your thieves’ tools to disarm a trap or open a lock, or take the Use an Object action.
    inventory:
    - name: Shortsword
      equipped: true
    - name: Shortbow
      equipped: true
    - name: Quiver
    - name: Arrow
      qty: 20
    - name: Backpack
    - name: Ball Bearings (bag of 1,000)
    - name: String (10 feet)
    - name: Bell
    - name: Candle
      qty: 5
    - name: Crowbar
    - name: Hammer
    - name: Piton
      qty: 10
    - name: Lantern, Hooded
    - name: Oil (flask)
      qty: 2
    - name: Rations (1 day)
      qty: 5
    - name: Tinderbox
    - name: Waterskin
    - name: Rope, Hempen (50 feet)
    - name: Leather
      equipped: true
    - name: Dagger
      qty: 2
      equipped: true
    - name: Thieves’ Tools
    - name: Holy symbol (a gift to you when you entered the priesthood)
    - name: Book
    - name: 5 sticks of incense
    - name: Vestments
    - name: Clothes, Common
    - name: Pouch
    - name: Boots of Elvenkind
      equipped: true
      magic: true
    - name: Potion of Healing
      magic: true
    currency:
      cp: 27
      sp: 14
      gp: 38
    persona:
      traits:
      - I always have an exit planned — and a second one, in case the first is on fire.
      - I can't resist a locked box. Not to steal from, just to know.
      ideal: Freedom. Chains are meant to be picked, and so are the people who make them.
      bond: My little brother Wim is apprenticed to a locksmith in Greyhaven. Everything I send home is so he never has to do what I do.
      flaw: I talk my way into trouble faster than I can sneak out of it.
      appearance: 24 years, Female, 2'11", 36 lb, Hazel eyes, Freckled tan skin, Curly auburn hair
      backstory: 'Tam grew up on the barges of the Silverflow, running dice games and cons for her aunt''s crew. When the crew sold a debtor to slavers, she picked the lock on his chains, sank the slavers'' skiff, and has been working the other side of the law ever since — mostly.
    
    
        Level 1: Signs on with a caravan heading upriver after a card game goes badly wrong in Greyhaven.
    
    
        Level 3: Takes the Boots of Elvenkind off a smuggler who won''t be needing them. Joins the Thieves'' Guild of Rellport on probation — the guildmaster wants her fast hands for a job in the duke''s vault.'
      allies: Aunt Morra (estranged, still running the barge crew); Wim Underbough; Old Hobb the fence at the Crooked Kettle
      deity: Brandobaris
      alignment: Chaotic Good
    source:
      from: CCC5e
      imported: '2026-10-08'
    note: Owes Pip Larkin twenty gold, and Pip hasn't forgotten.
  - player: Player Two
    character: Brother Kaelen Ashvale
    race: Human
    class: Monk (Way of the Open Hand)
    background: Acolyte
    level: 3
    ac: 16
    hp: 24
    hp_formula: 3d8
    speed: 40 ft.
    initiative: 3
    passive_perception: 13
    abilities: {str: 9, dex: 16, con: 15, int: 9, wis: 16, cha: 11}
    saves: Str +1, Dex +5
    skills: Acrobatics +5, Insight +5, Religion +1, Stealth +5
    languages: Common, Elvish, Celestial, Dwarvish
    proficiencies:
      weapons: Simple Weapons, Unarmed Strike, Shortsword
      tools: Tool Proficiency (Calligrapher's supplies)
    features:
      - name: Unarmored Defense
        text: While you are wearing no armor and not wielding a shield, your AC equals 16.
      - name: Martial Arts
        text: Your unarmed strike does 1d4+3 damage. You can use Strength or Dexterity for these attacks. When you use the Attack action with an unarmed strike or a monk weapon on your turn, you can make one unarmed strike as a bonus action. For example, if you take the Attack action and attack with a quarterstaff, you can also make an unarmed strike as a bonus action, assuming you haven’t already taken a bonus action this turn.
      - name: Ki
        text: You have 3 Ki Points and your Ki DC is 13
      - name: Unarmored Movement
        text: Your speed increases by 10 feet while you are not wearing armor or wielding a shield.
      - name: Open Hand Technique
        text: 'Whenever you hit a creature with one of the attacks granted by your Flurry of Blows, you can impose one of the following effects on that target: knock prone DEX Save, Push 15 feet STR Save, It can’t take reactions until the end of your next turn.'
      - name: Shelter of the Faithful
        text: As an acolyte, you command the respect of those who share your faith, and you can perform the religious ceremonies of your deity. You and your adventuring companions can expect to receive free healing and care at a temple, shrine, or other established presence of your faith, though you must provide any material components needed for spells. Those who share your religion will support you (but only you) at a modest lifestyle. You might also have ties to a specific temple dedicated to your chosen deity or pantheon, and you have a residence there. This could be the temple where you used to serve, if you remain on good terms with it, or a temple where you have found a new home. While near your temple, you can call upon the priests for assistance, provided the assistance you ask for is not hazardous and you remain in good standing with your temple.
    actions:
      - name: Unarmed Strike
        text: '*Attack:* +5 to hit, range 5 ft. *Hit:* 1d4+3 bludgeoning.'
      - name: Shortsword
        text: '*Attack:* +5 to hit, range 5 ft. *Hit:* 1d6+3 piercing.'
      - name: Dart
        text: '*Attack:* +5 to hit, range 20/60. *Hit:* 1d4+3 piercing.'
    bonus_actions:
      - name: Flurry of Blows (Ki)
        text: Immediately after you take the Attack action on your turn, you can spend 1 ki point to make two unarmed strikes.
      - name: Patient Defense (Ki)
        text: You can spend 1 ki point to take the Dodge action on your turn.
      - name: Step of the Wind (Ki)
        text: You can spend 1 ki point to take the Disengage or Dash action on your turn, and your jump distance is doubled for the turn.
    reactions:
      - name: Deflect Missiles
        text: You can deflect or catch the missile when you are hit by a ranged weapon attack. When you do so, the damage you take from the attack is reduced by 1d10+6. If you reduce the damage to 0, you can catch the missile if it is small enough for you to hold in one hand and you have at least one hand free. If you catch a missile in this way, you can spend 1 ki point to make a ranged attack with the weapon or piece of ammunition you just caught, as part of the same reaction. You make this attack with proficiency, regardless of your weapon proficiencies, and the missile counts as a monk weapon for the attack.
    inventory:
    - name: Shortsword
      equipped: true
    - name: Backpack
    - name: Crowbar
    - name: Hammer
    - name: Piton
      qty: 10
    - name: Torch
      qty: 10
    - name: Tinderbox
    - name: Rations (1 day)
      qty: 10
    - name: Waterskin
    - name: Rope, Hempen (50 feet)
    - name: Dart
      qty: 10
      equipped: true
    - name: Holy symbol (a gift to you when you entered the priesthood)
    - name: Book
    - name: 5 sticks of incense
    - name: Vestments
    - name: Clothes, Common
    - name: Pouch
    currency:
      sp: 40
      gp: 112
      pp: 3
    persona:
      traits:
      - I meditate at dawn and dusk, and I will politely refuse to leave until I'm finished.
      - I answer insults with a bow. It unsettles people more than a fist.
      ideal: Balance. Every strike must be one I'd be willing to receive.
      bond: The monastery of the Ninth Bell burned while I was away on pilgrimage. I will find out who lit the fire.
      flaw: I trust anyone who shows me kindness, which has not always gone well.
      appearance: 31 years, Male, 5'10", 160 lb, Pale grey eyes, Olive skin, Shaved hair
      backstory: 'Kaelen was a dockworker''s son sold to pay a debt, who escaped and collapsed at the gate of the Ninth Bell monastery. The monks took him in, and he stayed twenty years. He was on a silent pilgrimage when the monastery burned; he came home to ash and a single bell, cracked, still hanging.
    
    
        Level 3: Takes the vows of the Open Hand at the ruins, alone, with the cracked bell as his witness.'
      allies: Sister Oriane (the only other survivor, now a healer in Vell); the ferrymen's guild of the Tarn; Master Iro's memory
      deity: The Open Hand
      alignment: Lawful Good
    source:
      from: CCC5e
      imported: '2026-10-08'
  - player: Player Three
    character: Magister Ilvara Sorn
    race: Tiefling
    class: Wizard
    level: 3
    ac: 12
    hp: 17
    speed: 30 ft.
    languages: Common, Infernal
    actions:
      - name: Fire Bolt
        text: '*Attack:* +5 to hit, range 120 ft. *Hit:* 1d10 fire.'
