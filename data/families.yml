# Creature families for the encounter generator: who belongs together.
#
#   members  - creatures that make up the group (by name or id)
#   leaders  - who can lead it: a chieftain, captain, boss, or big monster the others serve
#   allies   - other families that plausibly show up alongside this one (sometimes mixed in)
#
# Edit freely: if the generator builds something that doesn't fit your world, change the
# table here. Names must match a creature exactly; the build warns about any it can't find.

# ---------------------------------------------------------------- humanoid tribes and bands
- family: Kobolds
  members: [Kobold, Giant Weasel]
  leaders: [Red Dragon Wyrmling, Blue Dragon Wyrmling, White Dragon Wyrmling]
  allies: [Red Dragons, Blue Dragons, White Dragons]

